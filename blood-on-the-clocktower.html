---
layout: default
title: Blood on the Clocktower
description: Blood on the Clocktower helper tools.
---

<script src="assets/js/blood-on-the-clocktower.js"></script>


<div class="container d-flex flex-column row-gap-2">
  <div class="row w-100 d-flex flex-column">
    <div class="row">
      <div class="col-12">
        <label for="role-input" class="form-label">
          Input role to get reminder tokens
        </label>
      </div>
    </div>
    <div class="row">
      <div class="col-8">
        <div class="position-relative">
          <input type="text" class="form-control" name="role-input" id="role-input" autocomplete="off"
            aria-autocomplete="list" aria-controls="role-suggestions" />

          <ul id="role-suggestions" class="list-group position-absolute w-100 shadow-sm"
            style="z-index: 1000; display: none;"></ul>
        </div>
      </div>
      <div class="col-4 align-self-end">
        <button type="submit" id="role-input-button">Find</button>
      </div>
    </div>
  </div>

  <div class="row w-100">
    <div class="col-12">
      <label for="reminders" class="form-label">Reminders</label>
      <textarea class="form-control resize-none font-monospace" rows="10" readonly id="reminders"></textarea>
    </div>
  </div>
</div>
